geometry:
  geom_grid_file: soca_gridspec
  mom6_input_nml: mom6_input.nml
  fields metadata: fields_metadata.yaml

date: '2021-07-03T00:00:00Z'

layers variable:
- sea_water_cell_thickness

domains:
- ocn

increment variables:
- sea_water_potential_temperature
- sea_water_salinity
- sea_surface_height_above_geoid
- sea_ice_area_fraction

set increment variables to zero:
- eastward_sea_water_velocity
- northward_sea_water_velocity

vertical geometry:
  read_from_file: 1
  basename: ./
  ocn_filename: ocn.nc
  date: &bkg_date 2021-07-03T00:00:00Z

soca increment:
  date: '2021-07-03T00:00:00Z'
  basename: ./
  ocn_filename: ocn.incr.nc
  ice_filename: ice.nc

soca background:
  read_from_file: 1
  basename: ./
  ocn_filename: ocn.nc
  ice_filename: ice.nc
  date: &bkg_date 2021-07-03T00:00:00Z
  state variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  - eastward_sea_water_velocity
  - northward_sea_water_velocity
  - sea_water_cell_thickness
  - ocean_mixed_layer_thickness
  - sea_water_depth
  - sea_ice_area_fraction

output increment:
  datadir: ./
  date: '2021-07-03T00:00:00Z'
  exp: mom6_iau_clim
  type: incr
  output file: mom6_iau_incqc_clim.nc

qc increment:

  background:
    read_from_file: 1
    basename: ./
    ocn_filename: ocn.nc
    date: &bkg_date 2021-07-03T00:00:00Z
    state variables:
    - sea_water_potential_temperature
    - sea_water_salinity
    - sea_surface_height_above_geoid
    - eastward_sea_water_velocity
    - northward_sea_water_velocity
    - sea_water_cell_thickness
    - ocean_mixed_layer_thickness
    - sea_water_depth

  state bounds:
    sea_water_potential_temperature: [-2, 45.0]
    sea_water_salinity: [0.0, 45.0]

  increment max:
    steric: 0.2

  increment stability iterations: 20

  steric increment:
    linear variable changes:
    - linear variable change name: BalanceSOCA

  # Climatology nudging configuration
  climatology:
    basename: "./climatology/"           # Directory with climatology files
    read_from_file: 1
    ocn_filename: ocean.clim_%mm.nc      # Ocean climatology template (% will be replaced with month)
    ice_filename: ice.clim_%mm.nc        # Ice climatology template (% will be replaced with month)
    date: 2018-04-15T00:00:00Z
    state variables:
    - sea_water_salinity
    - sea_water_potential_temperature
    - sea_ice_snow_thickness
    ocean:
      da window: 6.0                 # DA cycling window in hours
      relaxation time: 168.0         # Relaxation time scale in hours (7 days)
    ice:
      da window: 6.0                 # DA cycling window in hours
      relaxation time: 240.0         # Relaxation time scale in hours (10 days)
