---
  - class_name: "Temperature"
    short_name: "waterTemperature"
    name: "waterTemperature"
    bufr_mnemonic: "*/TMSLPFSQ/SST1"
    descriptor: "ObsValue"
    units: "degC"
    depth_profile_var_name: "depth"
    data_min: -10.0
    data_max: 50.0
    data_error: 0.12

  - class_name: "Salinity"
    short_name: "salinity"
    name: "salinity"
    bufr_mnemonic: "*/TMSLPFSQ/SALNH"
    descriptor: "ObsValue"
    units: "psu"
    depth_profile_var_name: "depth"
    data_min: 0.0 
    data_max: 45.0
    data_error: 1.0

  - class_name: "Depth"
    short_name: "depth"
    name: "Water depth"
    bufr_mnemonic: "*/TMSLPFSQ/DBSS"
    descriptor: "MetaData"
    units: "m"
    depth_profile_var_name: "depth"
    data_min: 0.0
    data_max: 10000.0
    data_error: 0.0

  - class_name: "Longitude"
    short_name: "longitude"
    name: "Longitude"
    bufr_mnemonic: "*/CLONH"
    descriptor: "MetaData"
    units: "degrees_east"
    depth_profile_var_name: "depth"
    data_min: -180.0
    data_max: 180.0
    data_error: 0.0

  - class_name: "Latitude"
    short_name: "latitude"
    name: "Latitude"
    bufr_mnemonic: "*/CLATH"
    descriptor: "MetaData"
    units: "degrees_north"
    depth_profile_var_name: "depth"
    data_min: -90.0
    data_max: 90.0
    data_error: 0.0

  - class_name: "StationID"
    short_name: "stationID"
    name: "Station Identification"
    bufr_mnemonic: "*/WMOP"
    descriptor: "MetaData"
    units: ""
    depth_profile_var_name: "depth"
    data_min: 0
    data_max: 0
    data_error: 0

  - class_name: "DateTime"
    short_name: "dateTime"
    name: "DateTime"
    descriptor: "MetaData"
    units: "seconds since 1970-01-01T00:00:00Z"
    depth_profile_var_name: "depth"
    data_min: 0
    data_max: 0
    data_error: 0
    bufr_mnemonics:
      year: '*/YEAR'
      month: '*/MNTH'
      day: '*/DAYS'
      hour: '*/HOUR'
      minute: '*/MINU'

  - class_name: "DateTime"
    short_name: "rcptDateTime"
    name: "RcptDateTime"
    descriptor: "MetaData"
    units: "seconds since 1970-01-01T00:00:00Z"
    depth_profile_var_name: "depth"
    data_min: 0
    data_max: 0
    data_error: 0
    bufr_mnemonics:
      ryear: '*/RCYR'
      rmonth: '*/RCMO'
      rday: '*/RCDY'
      rhour: '*/RCHR'
      rminute: '*/RCMI'
