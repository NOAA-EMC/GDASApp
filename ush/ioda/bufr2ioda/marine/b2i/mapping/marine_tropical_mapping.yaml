bufr:
  group_by_variable: depth
  variables:
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
    receiptTime:
      datetime:
        # {1} gets first instance of repeating element. Removes RCPTIM Dimension
        year: "*/RCPTIM{1}/RCYR"
        month: "*/RCPTIM{1}/RCMO"
        day: "*/RCPTIM{1}/RCDY"
        hour: "*/RCPTIM{1}/RCHR"
        minute: "*/RCPTIM{1}/RCMI"
    stationId:
      query: "*/RPID"
    latitude:
      query: "*/CLAT"
    longitude:
      query: "*/CLON"
    depth:
      query: "*/DTSCUR/DBSS"
    temperature:
      query: "*/DTSCUR/STMP"
      transforms:
        - offset: 273.15
    salinity:
      query: "*/DTSCUR/SALN"
    buoyType:
      query: "*/RPSEC4/BUYT"

  filters:
    - bounding:
        variable: temperature
        upperBound: 50.0
        lowerBound: -10.0
    - bounding:
        variable: salinity
        upperBound: 45.0
        lowerBound: 0.0

  splits:
    buoy:
      category:
        variable: buoyType
        map:
          _21: ATLAS
          _22: TRITON

encoder:
  variables:
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "dateTime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/rcptdateTime"
      source: variables/receiptTime
      longName: "'receipt Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [-180, 180]

    - name: "MetaData/latitude"
      source: variables/longitude
      longName: "latitude"
      units: "degrees_north"
      range: [ -90, 90 ]

    - name: "MetaData/stationId"
      source: variables/stationId
      longName: "Station Identification"
      units: "id"

    - name: "MetaData/depth"
      source: variables/depth
      longName: "Water depth"
      units: "m"

    - name: "MetaData/buoyType"
      source: variables/buoyType
      longName: "Buoy Type"
      units: "id"

    - name: "ObsValue/temperature"
      coordinates: "longitude latitude"
      source: variables/temperature
      longName: "Temperature"
      units: "deg C"
      range: [-10.0, 50.0]

    - name: "ObsValue/salinity"
      coordinates: "longitude latitude"
      source: variables/salinity
      longName: "Salinity"
      units: ""
      range: [ 0.0, 45.0 ]

