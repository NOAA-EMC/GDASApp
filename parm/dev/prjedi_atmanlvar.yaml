cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: "${YYYYb}-${MMb}-${DDb}T${HHb}:00:00Z"
    length: PT6H
    bound to include: begin
  geometry:
    fms initialization:
      namelist filename: ./fv3jedi/fmsmpp.nml
      field table filename: ./fv3jedi/field_table
    akbk: ./fv3jedi/akbk.nc4
    layout:
    - 8
    - 8
    npx: 385
    npy: 385
    npz: 127
  analysis variables:
  - eastward_wind
  - northward_wind
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - air_pressure_at_surface
  - ozone_mass_mixing_ratio
  - snow_water
  - rain_water
  - graupel
  - geopotential_height_at_surface
  - skin_temperature_at_surface
  background:
    datapath: ./bkg
    filetype: cube sphere history
    provider: ufs
    datetime: "${YYYYa}-${MMa}-${DDa}T${HHa}:00:00Z"
    filenames:
    - gdas.t${cycg}z.csg_atm.f006.nc
    - gdas.t${cycg}z.csg_sfc.f006.nc
    max allowable geometry difference: 1e-4
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - air_pressure_at_surface
    - ozone_mass_mixing_ratio
    - snow_water
    - rain_water
    - graupel
    - geopotential_height_at_surface
    - skin_temperature_at_surface
    - cloud_ice_number_concentration
    - rain_number_concentration
    - slmsk
    - sheleg
    - vtype
    - stype
    - vfrac
    - soilt
    - soilm
    - eastward_wind_at_surface
    - northward_wind_at_surface
    - ratio_of_wind_at_surface_adjacent_layer_to_wind_at_10m
    - air_temperature_at_2m
    field io names:
      eastward_wind: ugrd
      northward_wind: vgrd
      air_temperature: tmp
      layer_thickness: delz
      air_pressure_thickness: dpres
      air_pressure_at_surface: pressfc
      water_vapor_mixing_ratio_wrt_moist_air: spfh
      cloud_liquid_ice: icmr
      cloud_liquid_water: clwmr
      snow_water: snmr
      rain_water: rwmr
      graupel: grle
      cloud_ice_number_concentration: nccice
      rain_number_concentration: nconrd
      ozone_mass_mixing_ratio: o3mr
      ratio_of_wind_at_surface_adjacent_layer_to_wind_at_10m: f10m
      geopotential_height_at_surface: hgtsfc
      slmsk: land
      sheleg: weasd
      skin_temperature_at_surface: tmpsfc
      stype: sotyp
      vfrac: veg
      totalSnowDepthMeters: snod
      eastward_wind_at_surface: ugrd_hyblev1
      northward_wind_at_surface: vgrd_hyblev1
      soilm: soilw1
      soilt: soilt1
      soilMoistureVolumetric: smc
      air_temperature_at_2m: tmp2m
  background error:
    covariance model: SABER
    covariance type: gsi hybrid covariance
    saber central block:
      saber block name: gsi hybrid covariance
      read:
        gsi akbk: ./fv3jedi/akbk.nc4
        gsi error covariance file: ${DATA}/berror/gsi-coeffs-gfs-global.nc
        gsi berror namelist file: ${DATA}/berror/gfs_gsi_global.nml
        processor layout x direction: 24
        processor layout y direction: 16
        debugging mode: false
    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: gaussian
          lats: 386
          lons: 768
        custom partitioner matching gsi:
          bands: 16
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator
      state variables to inverse:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - snow_water
      - rain_water
      - graupel
      - ozone_mass_mixing_ratio
      - geopotential_height_at_surface
      - skin_temperature_at_surface
    linear variable change:
      linear variable change name: Control2Analysis
      input variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - snow_water
      - rain_water
      - graupel
      - mole_fraction_of_ozone_in_air
      - geopotential_height_at_surface
      - skin_temperature_at_surface
      output variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - snow_water
      - rain_water
      - graupel
      - ozone_mass_mixing_ratio
      - geopotential_height_at_surface
      - skin_temperature_at_surface
  observations:
    obs perturbations: false
    observers:
    - obs space:
        name: prepbufr_adpsfc
        obsdatain:
          engine:
            type: H5File
            obsfile: ${DATA}/obs/gdas.t${cyca}z.prepbufr_adpsfc.nc
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: ${DATA}/diags/diag_prepbufr_adpsfc_${adate}.nc
        io pool:
          max pool size: 1
        simulated variables:
        - stationPressure
        - airTemperatureAt2M
        observed variables:
        - stationPressure
        - airTemperatureAt2M
      obs operator:
        name: Composite
        components:
        - name: SfcCorrected
          correction scheme to use: GSL
          station_altitude: height
          geovar_sfc_geomz: height_above_mean_sea_level_at_surface
          geovar_geomz: geopotential_height
          variables:
          - name: stationPressure
        - name: Identity
          variables:
          - name: airTemperatureAt2M
      linear obs operator:
        name: Identity
        variable maps:
        - name: airTemperatureAt2M
          alias: air_temperature
          variables:
          - name: stationPressure
          - name: airTemperatureAt2M
      obs prior filters:
      - filter: RejectList
        udescriptor: obs_type_check_ps
        filter variables:
        - name: stationPressure
        where:
        - variable:
            name: ObsType/stationPressure
          is_not_in: 181, 187
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 181
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 80000
              - 75000
              - 60000
              - 55000
              errors:
              - 110
              - 120
              - 120
              - 100000000000.0
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 187
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 85000
              - 80000
              - 60000
              - 55000
              errors:
              - 120
              - 140
              - 140
              - 100000000000.0
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 180
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 60000
              - 55000
              errors:
              - 130
              - 100000000000.0
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 120
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 80000
              - 75000
              - 60000
              - 55000
              errors:
              - 110
              - 120
              - 120
              - 100000000000.0
      - filter: Variable Assignment
        assignments:
        - name: InputObsError/stationPressure
          type: float
          source variable: ObsErrorData/stationPressure
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: QualityMarker/stationPressure
          is_in: 3
        action:
          name: inflate error
          inflation factor: 1.2
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable:
            name: ObsType/stationPressure
          is_in: 180
        - variable:
            name: MetaData/observationSubTypeNum
          is_in: 0
        action:
          name: inflate error
          inflation factor: 0.7
      - filter: RejectList
        udescriptor: obs_type_check
        filter variables:
        - name: airTemperatureAt2M
        where:
        - variable:
            name: ObsType/airTemperatureAt2M
          is_not_in: 181
      - filter: RejectList
        filter variables:
        - name: airTemperatureAt2M
