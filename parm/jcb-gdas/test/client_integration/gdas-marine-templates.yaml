# This part is for testing only. Normally this would just show algorithm: <algorithm>
# -----------------------------------------------------------------------------------
supported_algorithms:
- hofx3d
- hofx4d
- 3dfgat
#- local_ensemble_da


# Search path for model and obs for JCB (relative for the submodule, or can be absolute)
# --------------------------------------------------------------------------------------
app_path_model: gdas/model/marine
app_path_observations: gdas/observations/marine
app_path_observation_chronicle: gdas/observation_chronicle/marine


# Places where we deviate from the generic file name of a yaml
# ------------------------------------------------------------
model_file: marine_model_pseudo
initial_condition_file: marine_background
background_error_file: marine_background_error_hybrid_diffusion_diffusion


# Global analysis things
# ----------------------
window_begin: '2024-01-31T21:00:00Z'
window_length: PT6H
bound_to_include: begin
minimizer: RPCG
final_diagnostics_departures: oman
analysis_variables: [cicen, hicen, hsnon, socn, tocn, uocn, vocn, ssh]
number_of_outer_loops: 1


# Model things
# ------------

# State variables
marine_det_state_variables: [sea_ice_area_fraction, sea_ice_thickness,
  sea_ice_snow_thickness, sea_water_salinity, sea_water_potential_temperature,
  sea_surface_height_above_geoid, air_temperature, bulk_ice_salinity,
  sea_water_cell_thickness, sea_water_depth, ocean_mixed_layer_thickness,
  snow_ice_surface_temperature]

marine_det_increment_variables: [sea_ice_area_fraction, sea_ice_thickness,
  sea_ice_snow_thickness, sea_water_salinity, sea_water_potential_temperature,
  sea_surface_height_above_geoid]

marine_saber_central_block_variables: [sea_ice_area_fraction, sea_water_salinity,
  sea_water_potential_temperature, sea_surface_height_above_geoid]

marine_soca_files_path: DATA/soca
marine_vt_levels: 25
marine_stddev_time: '2024-01-31T21:00:00Z'

# State variables
atmosphere_det_state_variables: [eastward_wind, northward_wind, air_temperature,
  water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice, cloud_liquid_water,
  air_pressure_at_surface, ozone_mass_mixing_ratio, snow_water, rain_water, graupel,
  geopotential_height_at_surface, cloud_ice_number_concentration, rain_number_concentration,
  slmsk, sheleg, skin_temperature_at_surface, vtype, stype, vfrac, soilt, soilm,
  eastward_wind_at_surface, northward_wind_at_surface, f10m]
atmosphere_ens_state_variables: [eastward_wind, northward_wind, air_temperature,
  water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice, cloud_liquid_water,
  air_pressure_at_surface, ozone_mass_mixing_ratio, snow_water, rain_water, graupel,
  cloud_ice_number_concentration, rain_number_concentration, slmsk, sheleg,
  skin_temperature_at_surface, vtype, stype, vfrac, soilt, soilm,
  eastward_wind_at_surface, northward_wind_at_surface, f10m,
  geopotential_height_at_surface, layer_thickness, air_pressure_thickness]
atmosphere_jedi2fv3inc_state_variables: [eastward_wind, northward_wind, air_temperature,
  water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice, cloud_liquid_water,
  air_pressure_at_surface, ozone_mass_mixing_ratio, snow_water, rain_water, graupel,
  geopotential_height_at_surface]

# Increment variables
atmosphere_det_increment_variables: [eastward_wind, northward_wind, air_temperature,
  water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice, cloud_liquid_water,
  air_pressure_at_surface, ozone_mass_mixing_ratio, snow_water, rain_water, graupel]
atmosphere_det_increment_variables_molesO3: [eastward_wind, northward_wind,
  air_temperature, water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice,
  cloud_liquid_water, air_pressure_at_surface, snow_water, rain_water, graupel,
  mole_fraction_of_ozone_in_air]
atmosphere_det_increment_variables_noprecip: [eastward_wind, northward_wind,
  air_temperature, water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice,
  cloud_liquid_water, air_pressure_at_surface, ozone_mass_mixing_ratio]
atmosphere_det_increment_variables_molesO3_noprecip: [eastward_wind, northward_wind,
  air_temperature, water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice,
  cloud_liquid_water, air_pressure_at_surface, mole_fraction_of_ozone_in_air]
atmosphere_fv3_increment_variables: [eastward_wind, northward_wind, air_temperature,
  water_vapor_mixing_ratio_wrt_moist_air, cloud_liquid_ice, cloud_liquid_water,
  ozone_mass_mixing_ratio, snow_water, rain_water, graupel,
  air_pressure_thickness, layer_thickness]

# Variable IO names
atmosphere_background_field_io_names:
    eastward_wind: ugrd
    northward_wind: vgrd
    air_temperature: tmp
    layer_thickness: delz
    air_pressure_thickness: dpres
    air_pressure_at_surface: pressfc
    water_vapor_mixing_ratio_wrt_moist_air: spfh
    cloud_liquid_ice: icmr
    cloud_liquid_water: clwmr
    snow_water: snmr
    rain_water: rwmr
    graupel: grle
    cloud_ice_number_concentration: nccice
    rain_number_concentration: nconrd
    ozone_mass_mixing_ratio: o3mr
    geopotential_height_at_surface: hgtsfc
    slmsk: land
    sheleg: weasd
    skin_temperature_at_surface: tmpsfc
    stype: sotyp
    vfrac: veg
    totalSnowDepthMeters: snod
    eastward_wind_at_surface: ugrd_hyblev1
    northward_wind_at_surface: vgrd_hyblev1
    soilm: soilw1
    soilt: soilt1
    soilMoistureVolumetric: smc
atmosphere_increment_field_io_names:
    eastward_wind: u_inc
    northward_wind: v_inc
    air_temperature: T_inc
    water_vapor_mixing_ratio_wrt_moist_air: sphum_inc
    cloud_liquid_water: liq_wat_inc
    ozone_mass_mixing_ratio: o3mr_inc
    cloud_liquid_ice: icmr_inc
    snow_water: snmr_inc
    rain_water: rwmr_inc
    graupel: grle_inc
    air_pressure_thickness: delp_inc
    layer_thickness: delz_inc

# Background
marine_background_time: '2024-01-31T21:00:00Z'
marine_background_path: DATA/bkg


# Background error
marine_window_middle: '2024-02-01T00:00:00Z'
marine_number_ensemble_members: 3

# Forecasting
marine_forecast_timestep: PT1H

# Minimization
marine_ninner_1: 3
marine_grad_red_1: 1e-4

# Forecast states
marine_pseudo_model_states:
- date: '2024-01-31T21:00:00Z'
  basename: base
  ocn_filename: ocn
  ice_filename: ice
  read_from_file: true
- date: '2024-02-01T00:00:00Z'
  basename: base
  ocn_filename: ocn
  ice_filename: ice
  read_from_file: true
- date: '2024-02-01T03:00:00Z'
  basename: base
  ocn_filename: ocn
  ice_filename: ice
  read_from_file: true

# Observation things
# ------------------
observations: all_observations

# Naming conventions for observational files
marine_obsdatain_path: DATA/obs
marine_obsdatain_prefix: OPREFIX
marine_obsdatain_suffix: ".2024020100.nc"

marine_obsdataout_path: DATA/diags
marine_obsdataout_prefix: diag
marine_obsdataout_suffix: "_2024020100.nc"

# Local Ensemble DA (LETKF)
# -------------------------
local_ensemble_da_solver: Deterministic GETKF

increment_variables: [cicen, hicen, hsnon, socn, tocn, uocn, vocn, ssh]

# Veritcal localization for GETKF
vl_fraction_of_retained_variance: 0.750
vl_lengthscale: 2.1
vl_lengthscale_units: logp
inflation_rtps: 0.85
inflation_rtpp: 0.0
inflation_mult: 1.0

# Driver
driver_update_obs_config_with_geometry_info: true
driver_save_posterior_mean: false
driver_save_posterior_ensemble: false
driver_save_prior_mean: false
driver_save_posterior_mean_increment: false
driver_save_posterior_ensemble_increments: true

# Diagnostics
marine_ensemble_increment_prefix: "./anl/mem%{member}%/atminc."
marine_posterior_output_gaussian: "./mem%{member}%/atmanl."
