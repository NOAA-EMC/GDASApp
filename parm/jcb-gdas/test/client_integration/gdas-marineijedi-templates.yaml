# This part is for testing only. Normally this would just show algorithm: <algorithm>
# -----------------------------------------------------------------------------------
supported_algorithms:
- hofx3d
- hofx4d
- 3dfgat
#- local_ensemble_da


# Search path for model and obs for JCB (relative for the submodule, or can be absolute)
# --------------------------------------------------------------------------------------
app_path_model: gdas/model/marineijedi
app_path_observations: gdas/observations/marine
app_path_observation_chronicle: gdas/observation_chronicle/marine


# Places where we deviate from the generic file name of a yaml
# ------------------------------------------------------------
model_file: marineijedi_model_pseudo
initial_condition_file: marineijedi_background
background_error_file: marineijedi_background_error_hybrid_diffusion_diffusion


# Global analysis things
# ----------------------
window_begin: '2024-01-31T21:00:00Z'
window_length: PT6H
bound_to_include: begin
minimizer: RPCG
final_diagnostics_departures: oman
analysis_variables: [socn, tocn, ssh]
number_of_outer_loops: 1


# Model things (i-jedi mom6 geometry)
# -----------------------------------
marineijedi_ocean_hgrid: DATA/mom6/ocean_hgrid.nc
marineijedi_ocean_topog: DATA/mom6/ocean_topog.nc
marineijedi_vertical_geometry_from: DATA/mom6/MOM.res.nc
marineijedi_coarsen_factor: 1
marineijedi_has_northern_fold: true
marineijedi_niglobal: 72
marineijedi_njglobal: 35
marineijedi_nz: 25
marineijedi_layout: [1, 1]
marineijedi_minimum_depth: 0.5
marineijedi_fix_file: mom6_structuredgeometry_cache_grid.nc

marineijedi_vt_levels: 25
marineijedi_stddev_time: '2024-01-31T21:00:00Z'

# Diffusion calibration
marineijedi_unstructured_grid_file: mom6_unstructuredgeometry_cache_grid.nc
marineijedi_diffusion_normalization_iterations: 1000
marineijedi_hz_diffusion_sigma: 100000.0
marineijedi_vt_diffusion_sigma: 2.0

# Background
marineijedi_background_time: '2024-01-31T21:00:00Z'
marineijedi_background_path: DATA/bkg


# Background error
marineijedi_window_middle: '2024-02-01T00:00:00Z'
marineijedi_number_ensemble_members: 3

# Forecasting
marineijedi_forecast_timestep: PT1H

# Minimization
marineijedi_ninner_1: 3
marineijedi_grad_red_1: 1e-4

# Forecast states
marineijedi_pseudo_model_states:
- date: '2024-01-31T21:00:00Z'
  datapath: DATA/bkg
  ocn_file: MOM.res.nc
  ice_file: cice6.nc
- date: '2024-02-01T00:00:00Z'
  datapath: DATA/bkg
  ocn_file: MOM.res.nc
  ice_file: cice6.nc
- date: '2024-02-01T03:00:00Z'
  datapath: DATA/bkg
  ocn_file: MOM.res.nc
  ice_file: cice6.nc

# Observation things
# ------------------
observations: all_observations

# Naming conventions for observational files
marine_obsdatain_path: DATA/obs
marine_obsdatain_prefix: OPREFIX
marine_obsdatain_suffix: ".2024020100.nc"

marine_obsdataout_path: DATA/diags
marine_obsdataout_prefix: diag
marine_obsdataout_suffix: "_2024020100.nc"

# Local Ensemble DA (LETKF)
# -------------------------
local_ensemble_da_solver: Deterministic GETKF

increment_variables: [socn, tocn, ssh]

# Vertical localization for GETKF
vl_fraction_of_retained_variance: 0.750
vl_lengthscale: 2.1
vl_lengthscale_units: logp
inflation_rtps: 0.85
inflation_rtpp: 0.0
inflation_mult: 1.0

# Driver
driver_update_obs_config_with_geometry_info: true
driver_save_posterior_mean: false
driver_save_posterior_ensemble: false
driver_save_prior_mean: false
driver_save_posterior_mean_increment: false
driver_save_posterior_ensemble_increments: true
