# This part is for testing only. Normally this would just show algorithm: <algorithm>
# -----------------------------------------------------------------------------------
supported_algorithms:
- hofx3d
- 3dfgat

# Search path for model and obs for JCB (relative for the submodule, or can be absolute)
# --------------------------------------------------------------------------------------
app_path_model: gdas/model/marine
app_path_observations: gdas/observations/marine
app_path_observation_chronicle: gdas/observation_chronicle/marine

# i-jedi interface: route the model fragment includes to the marine_ijedi_* templates
# ------------------------------------------------------------------------------------
model_component: marine_ijedi_

# Places where we deviate from the generic file name of a yaml
# ------------------------------------------------------------
model_file: marine_ijedi_model_pseudo
initial_condition_file: marine_ijedi_background
output_file: marine_ijedi_output
final_increment_file: marine_ijedi_final_increment
background_error_file: marine_ijedi_background_error_static_diffusion


# Global analysis things
# ----------------------
window_begin: '2024-01-31T21:00:00Z'
window_length: PT6H
bound_to_include: begin
minimizer: RPCG
final_diagnostics_departures: oman
analysis_variables: [sea_water_salinity, sea_water_potential_temperature, sea_surface_height_above_geoid]
number_of_outer_loops: 1


# Model things
# ------------
marine_soca_files_path: DATA/soca
marine_vt_levels: 25
marine_stddev_time: '2024-01-31T21:00:00Z'

# i-jedi MOM6 geometry
marine_ijedi_niglobal: 72
marine_ijedi_njglobal: 35
marine_ijedi_nz: 25
marine_ijedi_layout_x: 2
marine_ijedi_layout_y: 1
marine_ijedi_minimum_depth: 0.0

# i-jedi state variables and file-variable name map (ocean only)
marine_ijedi_state_variables: [sea_water_salinity, sea_water_potential_temperature, sea_surface_height_above_geoid]
marine_ijedi_field_io_names:
  sea_water_potential_temperature: Temp
  sea_water_salinity: Salt
  sea_surface_height_above_geoid: ave_ssh

# Static B central block variables
marine_ijedi_saber_central_block_variables: [sea_water_salinity, sea_water_potential_temperature, sea_surface_height_above_geoid]

# Background
marine_background_time: '2024-01-31T21:00:00Z'
marine_background_path: DATA/bkg


# Background error
marine_window_middle: '2024-02-01T00:00:00Z'
marine_window_middle_iso: '2024-02-01T00:00:00Z'
marine_number_ensemble_members: 3

# Forecasting
marine_forecast_timestep: PT1H

# Minimization
marine_ninner_1: 3
marine_grad_red_1: 1e-4

# Output
marine_output_dir: Data
marine_output_exp: 3dvarfgat_pseudo
marine_output_freq: PT3H

# Final increment
marine_final_increment_dir: Data
marine_final_increment_exp: 3dvarfgat_pseudo

# Forecast states
marine_pseudo_model_states:
- date: '2024-01-31T21:00:00Z'
  basename: base
  ocn_filename: ocn
  ice_filename: ice
  read_from_file: true
- date: '2024-02-01T00:00:00Z'
  basename: base
  ocn_filename: ocn
  ice_filename: ice
  read_from_file: true
- date: '2024-02-01T03:00:00Z'
  basename: base
  ocn_filename: ocn
  ice_filename: ice
  read_from_file: true

# Observation things
# ------------------
observations: all_observations

# Naming conventions for observational files
marine_obsdatain_path: DATA/obs
marine_obsdatain_prefix: OPREFIX
marine_obsdatain_suffix: ".2024020100.nc"

marine_obsdataout_path: DATA/diags
marine_obsdataout_prefix: diag
marine_obsdataout_suffix: "_2024020100.nc"
