  air_temperature: T
  air_pressure_thickness: delp
  water_vapor_mixing_ratio_wrt_moist_air: sphum
  mass_fraction_of_sulfate_in_air: so4
  mass_fraction_of_hydrophobic_black_carbon_in_air: bc1
  mass_fraction_of_hydrophilic_black_carbon_in_air: bc2
  mass_fraction_of_hydrophobic_organic_carbon_in_air: oc1
  mass_fraction_of_hydrophilic_organic_carbon_in_air: oc2
  mass_fraction_of_dust001_in_air: dust1
  mass_fraction_of_dust002_in_air: dust2
  mass_fraction_of_dust003_in_air: dust3
  mass_fraction_of_dust004_in_air: dust4
  mass_fraction_of_dust005_in_air: dust5
  mass_fraction_of_sea_salt001_in_air: seas2
  mass_fraction_of_sea_salt002_in_air: seas3
  mass_fraction_of_sea_salt003_in_air: seas4
  mass_fraction_of_sea_salt004_in_air: seas5

# Background
aero_background_path: ./bkg
aero_background_time_iso: '2024-01-31T21:00:00Z'
aeroijedi_background_time_fv3: '20240131.210000'
aero_cycle_time_iso: '2024-02-01T00:00:00Z'
aero_cycle_time_fv3: '20240201.000000'
aero_background_error_time_iso: '2024-02-01T06:00:00Z'
aero_background_error_time_fv3: '20240201.060000'

# Forecasting (PseudoModel states start at window begin + tstep)
aero_forecast_timestep: PT3H
aeroijedi_pseudo_model_states:
- date: '2024-02-01T00:00:00Z'
  fv3time: '20240201.000000'
- date: '2024-02-01T03:00:00Z'
  fv3time: '20240201.030000'

# Background error
aero_berror_data_directory: ./berror
aero_berror_diffusion_directory: ./diffusion
aero_diffusion_iter: 10
aero_diffusion_horiz_len: 2500000.0
aero_diffusion_fixed_val: 1.5

# Analysis
aero_analysis_path: ./anl


# Observation things
# ------------------
observations:
- retrieval_aod_viirs_npp
- retrieval_aod_viirs_n20
- retrieval_aod_viirs_n21

crtm_coefficient_path: ./crtm/

aero_obsdatain_path: ./obs/
aero_obsdatain_prefix: gdas.t00z.
aero_obsdatain_suffix: .nc
aero_obsdataout_path: ./diags/
aero_obsdataout_prefix: diag_
aero_obsdataout_suffix: _2024020100.nc
