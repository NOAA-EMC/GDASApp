  categories: 5
  io file: ice
  io sup name: vsnon
  io name: vsno<CATEGORY>
  property: positive_definite

# --------------------------------------------------------------------------------------------------
# CICE restart thermo/pond variables with category dimension (per-category 2D
# fields). io sup name is the literal CICE restart variable name.
# --------------------------------------------------------------------------------------------------
- name: sea_ice_category<CATEGORY>_surface_temperature
  categories: 5
  io file: ice
  io sup name: Tsfcn
  io name: Tsfcn<CATEGORY>

- name: sea_ice_category<CATEGORY>_pond_area_fraction
  categories: 5
  io file: ice
  io sup name: apnd
  io name: apnd<CATEGORY>
  property: positive_definite

- name: sea_ice_category<CATEGORY>_pond_depth
  categories: 5
  io file: ice
  io sup name: hpnd
  io name: hpnd<CATEGORY>
  property: positive_definite

- name: sea_ice_category<CATEGORY>_pond_lid_thickness
  categories: 5
  io file: ice
  io sup name: ipnd
  io name: ipnd<CATEGORY>
  property: positive_definite

# --------------------------------------------------------------------------------------------------
# CICE restart per-layer thermo variables (category x layer 2D fields). Each
# CICE layer is its own restart variable qice00N / sice00N / qsno00N, so these
# expand via the <LEVEL> placeholder into one single-level field per (cat,layer).
# --------------------------------------------------------------------------------------------------
- name: sea_ice_category<CATEGORY>_layer<LEVEL>_enthalpy
  categories: 5
  layers: 7
  io file: ice
  io sup name: qice00<LEVEL>
  io name: qice<CATEGORY>_00<LEVEL>

- name: sea_ice_category<CATEGORY>_layer<LEVEL>_ice_salinity
  categories: 5
  layers: 7
  io file: ice
  io sup name: sice00<LEVEL>
  io name: sice<CATEGORY>_00<LEVEL>

- name: sea_ice_snow_category<CATEGORY>_layer<LEVEL>_enthalpy
  categories: 5
  layers: 1
  io file: ice
  io sup name: qsno00<LEVEL>
  io name: qsno<CATEGORY>_00<LEVEL>

