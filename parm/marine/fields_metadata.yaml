# --------------------------------------------------------------------------------------------------
# ice state variables with category dimension
# --------------------------------------------------------------------------------------------------
- name: sea_ice_category<CATEGORY>_area_fraction
  categories: 5
  io file: ice
  io sup name: aicen
  io name: aice<CATEGORY>
  property: positive_definite

- name: sea_ice_category<CATEGORY>_volume
  categories: 5
  io file: ice
  io sup name: vicen
  io name: vice<CATEGORY>
