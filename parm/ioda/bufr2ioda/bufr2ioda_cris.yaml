observations:
  - obs space:
      name: bufr
      obsdatain: "{{ DMPDIR }}/{{ RUN }}.{{ PDY }}/{{ cyc }}/atmos/{{ RUN }}.t{{ cyc }}z.crisf4.tm00.bufr_d"

      exports:
        variables:
          # MetaData
          timestamp:
            datetime:
              year: "*/YEAR"
              month: "*/MNTH"
              day: "*/DAYS"
              hour: "*/HOUR"
              minute: "*/MINU"
              second: "*/SECO"

          latitude:
            query: "*/CLATH"

          longitude:
            query: "*/CLONH"

          satelliteId:
            query: "*/SAID"

          sensorId:
            query: "*/SIID[1]"

          scanLineNumber:
            query: "*/SLNM"

          fieldOfViewNumber:
            query: "*/FOVN"

          fieldOfRegardNumber:
            query: "*/FORN"

          sensorScanPosition:
            query: "*/FOVN"

          solarZenithAngle:
            query: "*/SOZA"

          solarAzimuthAngle:
            query: "*/SOLAZI"

          sensorZenithAngle:
            query: "*/SAZA"

          sensorAzimuthAngle:
            query: "*/BEARAZ"

          sensorViewAngle:
            sensorScanAngle:
              fieldOfViewNumber: "*/FOVN"
              fieldOfRegardNumber: "*/FORN"
              scanStart: -48.330
              scanStep: 3.3331
              sensor: cris

          sensorChannelNumber:
            query: "*/CRCHNM/CHNM"

          # ObsValue
          cloudCoverTotal:
            query: "*/TOCC"
            type: float
            transforms:
              - scale: 0.01

          cloudTopHeight:
            query: "*/HOCT"
            type: float

          spectralRadiance:
            query: "*/CRCHNM/SRAD"
            transforms:
              - scale: 0.01

        splits:
          satId:
            category:
              variable: satelliteId
              map:
                _224: npp 
                _225: n20 
                _226: n21 

    ioda:
      backend: netcdf
      obsdataout: "{{ COMOUT_OBS }}/{{ RUN }}.t{{ cyc }}z.cris-fsr_$(splitvar).tm00.nc" 

      dimensions:
        - name: Channel
          source: variables/sensorChannelNumber
          path: "*/CRCHNM" 

      globals:
        - name: "platformCommonName"
          type: string
          value: "Meteorological Operational Satellite"

        - name: "platformLongDescription"
          type: string
          value: "EUMETSAT Polar System in sunsynchronous orbit"

        - name: "source"
          type: string
          value: "MTYP 021-241 CrIS 1C RADIANCES (VARIABLE CHNS) (METOP)"

        - name: "sourceFiles"
          type: string
          value: "gdas.t00z.crisf4.tm00.bufr_d"

        - name: "datetimeReference"
          type: string
          value: "2021-08-01T00:00:00Z"

        - name: "sensor"
          type: string
          value: "CrIS"

        - name: "processingLevel"
          type: string
          value: "Level-1C"

        - name: "converter"
          type: string
          value: "BUFR"

      variables:

        # MetaData 
        - name: "MetaData/dateTime"
          source: variables/timestamp
          longName: "Datetime"
          units: "seconds since 1970-01-01T00:00:00Z"

        - name: "MetaData/latitude"
          source: variables/latitude
          longName: "Latitude"
          units: "degrees_north"
          range: [ -90, 90 ]

        - name: "MetaData/longitude"
          source: variables/longitude
          longName: "Longitude"
          units: "degrees_east"
          range: [ -180, 180 ]

        - name: "MetaData/satelliteIdentifier"
          source: variables/satelliteId
          longName: "Satellite Identifier"

#        - name: "MetaData/instrumentIdentifier"
#          source: variables/sensorId
#          longName: "Satellite Instrument Identifier"

        - name: "MetaData/scanLineNumber"
          source: variables/scanLineNumber
          longName: "Scan Line Number"

        - name: "MetaData/fieldOfViewNumber"
          source: variables/fieldOfViewNumber
          longName: "Field of View Number"

        - name: "MetaData/fieldOfRegardNumber"
          source: variables/fieldOfRegardNumber
          longName: "Field of Regard Number"

        - name: "MetaData/sensorScanPosition"
          source: variables/sensorScanPosition
          longName: "Sensor Scan Position"

        - name: "MetaData/solarZenithAngle"
          source: variables/solarZenithAngle
          longName: "Solar Zenith Angle"
          units: "degree"
          range: [ 0, 180 ]

        - name: "MetaData/solarAzimuthAngle"
          source: variables/solarAzimuthAngle
          longName: "Solar Azimuth Angle"
          units: "degree"
          range: [ 0, 360 ]

        - name: "MetaData/sensorZenithAngle"
          source: variables/sensorZenithAngle
          longName: "Sensor Zenith Angle"
          units: "degree"
          range: [ 0, 90 ]

        - name: "MetaData/sensorAzimuthAngle"
          source: variables/sensorAzimuthAngle
          longName: "Sensor Azimuth Angle"
          units: "degree"
          range: [ 0, 360 ]

        - name: "MetaData/sensorViewAngle"
          source: variables/sensorViewAngle
          longName: "Sensor View Angle"
          units: "degree"

        - name: "MetaData/sensorChannelNumber"
          source: variables/sensorChannelNumber
          longName: "Sensor Channel Number"

        - name: "ObsValue/cloudCoverTotal"
          source: variables/cloudCoverTotal
          longName: "Total Cloud Cover"
          units: "1"
          range: [ 0, 1 ]

        - name: "ObsValue/heightOfTopOfCloud"
          source: variables/cloudTopHeight
          longName: "Height of Top of Cloud"
          units: "m"

        - name: "ObsValue/spectralRadiance"
          source: variables/spectralRadiance
          longName: "CrIS Spectral Radiance"
          units: "W m-2 sr-1 m-1"
